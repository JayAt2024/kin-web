# 构建产物同时部署到两个目标：
#   1. GitHub Pages（境外访问）
#   2. 阿里云 ECS（境内访问，Nginx 静态托管）
# 域名：https://kinhealth.jaytech.top（阿里云云解析按境内/境外分线路）
# 前置：仓库 Settings → Pages → Source 需选择 "GitHub Actions"
name: Deploy (GitHub Pages + ECS)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 部署模式构建：根路径 + 独立资源文件（区别于本地单文件模式）
      - run: npm run build
        env:
          VITE_DEPLOY: 'true'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # 供 deploy-ecs job 下载
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 需要配置仓库 Variables/Secrets 后才会执行：
  #   Variable: ENABLE_ECS_DEPLOY = true
  #   Secrets:  ECS_HOST / ECS_PORT / ECS_USER / ECS_WEB_ROOT / ECS_SSH_KEY
  deploy-ecs:
    if: ${{ vars.ENABLE_ECS_DEPLOY == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ECS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.ECS_PORT }}" "${{ secrets.ECS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync dist to ECS
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.ECS_PORT }}" \
            dist/ \
            "${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:${{ secrets.ECS_WEB_ROOT }}/"
